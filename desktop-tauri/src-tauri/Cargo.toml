[package]
name = "amb-desktop"
version = "1.0.0"
description = "Agent Memory Backpack Desktop (Tauri)"
authors = ["AMB Team"]
edition = "2021"
# Same floor as cc-switch: tauri 2.8 requires a recent toolchain, and pinning it
# here keeps the "which rustc do I need" question answerable from the manifest.
rust-version = "1.85.0"

[lib]
name = "amb_desktop_lib"
# rlib only: this is a desktop shell, not a mobile plugin, so the cdylib/staticlib
# targets cc-switch keeps for mobile builds would only slow the build down.
crate-type = ["lib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Features mirror cc-switch: `tray-icon` for the tray itself, `image-png` because
# Image::from_bytes (the tray icon path) decodes PNG.
tauri = { version = "2.8", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
# Login-item helper. cc-switch pins the same major version.
auto-launch = "0.5"
# auto_launch.rs logs through `log::info!` / `log::error!`.
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }

# cc-switch gates this plugin the same way: it is a desktop-only plugin.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Deliberately NOT pulled in at this stage, with the reason and the extra setup
# each one would demand:
#   * tauri-plugin-updater: needs a signing keypair plus a hosted endpoint, and
#     `bundle.createUpdaterArtifacts`. Adding it without those produces a plugin
#     that can never complete an update; it also makes every release artifact
#     signature-mandatory. TODO: add together with the key and the endpoint.
#   * tauri-plugin-deep-link: needs a scheme declared in `plugins.deep-link` and
#     registered with the OS. No scheme is defined for AMB yet, so the plugin
#     would only add an unused protocol handler. TODO: add when a scheme exists.

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Values taken from cc-switch: faster release build (codegen-units 16), thinner
# binary. `panic = "unwind"` is kept so a panic hook can still capture a backtrace.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
